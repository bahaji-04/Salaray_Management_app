{% extends "base.html" %}

{% block title %}Log in · Salary App{% endblock %}

{% block content %}
<div class="auth">
    <form class="box" action="/login" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <h1>Log in</h1>
            <p class="muted">Welcome back. Your months are waiting.</p>
        </div>

        {% if error %}
            <div class="err">{{ error }}</div>
        {% endif %}

        <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" required>
        </div>
        <label class="check">
            <input type="checkbox" onclick="var pw = document.getElementById('password'); pw.type = pw.type === 'password' ? 'text' : 'password';">
            Show password
        </label>

        <button class="btn" type="submit">Log in</button>
        <p class="muted">No account yet? <a href="/signup">Sign up</a></p>
    </form>
</div>
{% endblock %}
