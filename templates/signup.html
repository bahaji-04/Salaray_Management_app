{% extends "base.html" %}

{% block title %}Sign up · Salary App{% endblock %}

{% block content %}
<div class="auth">
    <form class="box" action="/signup" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <h1>Create your account</h1>
            <p class="muted">Start tracking your salary and spending.</p>
        </div>

        {% if error %}
            <div class="err">{{error}}</div>
        {% endif %}

        <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" maxlength="50" value="{{ request.form.get('username', '') }}" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" required>
        </div>
        <label class="check">
            <input type="checkbox" onclick="var pw = document.getElementById('password'); pw.type = pw.type === 'password' ? 'text' : 'password';">
            Show password
        </label>

        <button class="btn" type="submit">Sign up</button>
        <p class="muted">Already have an account? <a href="/login">Log in</a></p>
    </form>
</div>
{% endblock %}
