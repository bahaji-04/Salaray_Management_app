{% extends "base.html" %}

{% block title %}Change password · Salary App{% endblock %}

{% block back %}<a class="back" href="/account">Account</a>{% endblock %}

{% block content %}
<h1 class="page-head">Change password</h1>

<form class="card form" action="/account/user-password" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if error %}
        <div class="err">{{ error }}</div>
    {% endif %}

    <div class="field">
        <label for="old_password">Current password</label>
        <input id="old_password" type="password" name="old_password" autocomplete="current-password" required>
    </div>
    <div class="field">
        <label for="new_password">New password</label>
        <input id="new_password" type="password" name="new_password" autocomplete="new-password" required>
    </div>
    <label class="check">
        <input type="checkbox" onclick="['old_password', 'new_password'].forEach(function (id) { var pw = document.getElementById(id); pw.type = pw.type === 'password' ? 'text' : 'password'; });">
        Show passwords
    </label>

    <div class="form-actions">
        <button class="btn block" type="submit">Update password</button>
        <a class="btn ghost block" href="/account">Cancel</a>
    </div>
</form>
{% endblock %}
