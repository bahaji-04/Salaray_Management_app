{% extends "base.html"%}
{% block title %} Change Password {% endblock%}

{% block content %}

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form action="/account/user-password" method="post">
        <br>
        <label> Your password </label>
        <input type="password" name="old_password" required>
         <input type="checkbox" onclick="
            var pw = document.querySelector('input[name=old_password]');
            if(pw.type === 'password') {pw.type = 'text'} else {pw.type = 'password'}
        "> Show password
        <br>

        <label> Enter Your new password</label>
        <input type="password" name="new_password" required>
        <input type="checkbox" onclick="
            var pw = document.querySelector('input[name=new_password]');
            if(pw.type === 'password') {pw.type = 'text'} else {pw.type = 'password'}
        "> Show password

        <br>

        <button type="submit">Change Password</button>

    </form>
{% endblock %}
