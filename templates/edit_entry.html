{% extends "base.html" %}
{% block content %}

    <h2>Modify Your Entry</h2>
 
    <form method="post" action="/edit-entry/{{ entry.id }}">
        <label>Category:</label>
        <select name="category_id" required>
            {% for category in categories %}
                <option value="{{ category.id }}" {% if category.id == entry.categories_id %}selected{% endif %}>{{ category.name }}</option>
            {% endfor %}
        </select>
        <br>
        <label>Amount:</label>
        <input type="text" name="amount" value="{{ entry.amount }}" required>
        <br>
        <label>Type:</label>
        <select name="type" required>
            <option value="income" {% if entry.type == 'income' %}selected{% endif %}>Income</option>
            <option value="expense" {% if entry.type == 'expense' %}selected{% endif %}>Expense</option>
        </select>
        <br>
        <label>Date:</label>
        <input type="date" name="entry_date" value="{{ entry.entry_date }}" required>
        <br>
        <label>Note:</label>
        <input type="text" name="note" value="{{ entry.note }}">
        <br>
 
        <button type="submit">Submit</button>
    </form>
 
{% endblock %}
