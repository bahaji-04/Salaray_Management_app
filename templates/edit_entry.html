{% extends "base.html" %}

{% block title %}Edit Entry · Salary App{% endblock %}

{% block content %}
<a class="back" href="/spending/{{ entry.entry_date[:7] }}">← Back to {{ entry.entry_date[:7] }}</a>

<div class="page-head">
    <div>
        <div class="eyebrow">Edit entry</div>
        <h1>Modify your entry</h1>
    </div>
</div>

<form class="panel form" method="post" action="/edit-entry/{{ entry.id }}">
    <div class="seg">
        <input class="inc" type="radio" name="type" id="type-income" value="income" {% if entry.type == 'income' %}checked{% endif %} required>
        <label for="type-income">Income</label>
        <input class="exp" type="radio" name="type" id="type-expense" value="expense" {% if entry.type == 'expense' %}checked{% endif %}>
        <label for="type-expense">Expense</label>
    </div>

    <div class="field">
        <label for="amount">Amount</label>
        <input id="amount" class="amount-in" type="text" inputmode="decimal" name="amount" value="{{ entry.amount }}" required>
    </div>

    <div class="field">
        <label for="category">Category</label>
        <select id="category" name="category_id" required>
            {% for category in categories %}
                <option value="{{ category.id }}" {% if category.id == entry.categories_id %}selected{% endif %}>{{ category.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="field">
        <label for="entry_date">Date</label>
        <input id="entry_date" type="date" name="entry_date" value="{{ entry.entry_date }}" required>
    </div>

    <div class="field">
        <label for="note">Note</label>
        <input id="note" type="text" name="note" value="{{ entry.note or '' }}">
    </div>

    <div class="form-actions">
        <button class="btn" type="submit">Save changes</button>
        <a class="btn ghost" href="/spending/{{ entry.entry_date[:7] }}">Cancel</a>
    </div>
</form>
{% endblock %}
